<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <h1 class="mb-1">User profile</h1>
      <p class="subtitle mb-4">See your information or log out</p>

      <div class="d-flex flex-column">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" [value]="user()?.email ?? ''" disabled />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Full name</mat-label>
          <input matInput [value]="user()?.fullName ?? ''" disabled />
        </mat-form-field>

        <button matButton="tonal" class="logout-button mt-5" [disabled]="loggingOut()" (click)="logout()">
          {{ loggingOut() ? 'Logging out…' : 'Log out' }}
        </button>
      </div>
    </div>
  </div>
</div>
